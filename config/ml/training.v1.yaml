version: ulb_training.v1
preprocessing_version: preprocessing.v1
seed: 42
threshold:
  metric: f1
  recall_floor: 0.80
  tie_breaking:
    - highest_f1
    - highest_recall
    - highest_threshold
logistic_regression:
  class_weight: balanced
  max_iter: 1000
  solver: lbfgs
random_forest:
  class_weight: balanced_subsample
  n_estimators: 200
  max_depth: 16
  min_samples_leaf: 2
  n_jobs: 1
