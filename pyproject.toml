[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "suspicious-activity-detection"
version = "0.1.0"
description = "Query-aware suspicious activity detection hackathon platform"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.140.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.9.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=backend.app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["backend.app"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "Credit-Card-Fraud-Detection",
    "Fraud Detection",
    "third_party",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
exclude = "(Credit-Card-Fraud-Detection|third_party)"

